# Пакет-дело §168.4: деление без правила округления. Вымышленное дело
# logement-foyer, где E0 ст. D. 832-26 («le total étant divisé par douze») — не
# конечная десятичная дробь. Два дела с одними фактами: без прочтения канон
# отказывает (INEXACT_DIVISION), с прочтением D-82 `fr.apl::ArrondiCentimeHalfUp`
# (практика CNAF: до сантима, HALF_UP) — даёт сумму. Владелец деления — fr.apl.
[package]
name = "examples.fr.apl.douzieme_sans_arrondi"
version = "0.1.0"
language = "0.2"
namespace = "urn:law:examples:fr:apl:douzieme-sans-arrondi"

[dependencies]
"fr.apl" = "0.1.0"

[[cases]]
name = "ResidentSansLecture"
path = "cases/resident-sans-lecture.lawcase"

[[cases]]
name = "ResidentLectureD82"
path = "cases/resident-lecture-d82.lawcase"

# Двойник §267 вопросов check.py (те же факты и ожидания).
[[tests]]
family = "examples.fr.apl.douzieme_sans_arrondi#cas"
regression = false
suites = ["tests/douzieme-sans-arrondi.lawtest"]
world = ["examples.fr.apl.douzieme_sans_arrondi", "fr.apl"]

[metadata]
act = "fr-apl-examples-douzieme-sans-arrondi"

[authoring]
local_imports = "explicit"
